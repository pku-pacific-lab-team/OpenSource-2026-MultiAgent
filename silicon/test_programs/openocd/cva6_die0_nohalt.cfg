# ------------------------------------------------------------------------------
# Description:     OpenOCD configuration with deferred examine for bus-level (SBA) access only
# Author:          Mingxuan Li
# Acknowledgement: Claude Code + Claude Fable 5
# Date:            2026-07-13
# ------------------------------------------------------------------------------

adapter speed 1000

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0

ftdi layout_init 0x0018 0x001b
reset_config none

transport select jtag

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0 -defer-examine

gdb report_data_abort enable
gdb report_register_access_error enable

riscv set_command_timeout_sec 10
riscv set_mem_access progbuf sysbus abstract

init
poll off
echo "Die0 JTAG-DMI ready. CPU examine/halt is deferred."
